# Forward proxy for the fetcher. Only HTTPS tunnels (CONNECT to port 443) to host names matching
# allowed-domains pass; plain HTTP and every other host are refused. Logs host names, never contents
# (traffic is TLS end to end between the fetcher's browser and the bank).
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 50
LogLevel Connect
# Only the fetcher (fixed address in compose.yaml); the app has no way out at all.
Allow 172.31.80.10
ConnectPort 443
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
Filter "/etc/tinyproxy/allowed-domains"
DisableViaHeader Yes
