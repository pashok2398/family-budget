[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "family-budget"
version = "0.1.0"
description = "Local-first Israeli household finance"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1",
  "pandas>=2.2,<4", "openpyxl>=3.1,<4", "pymupdf>=1.25,<2", "pdfplumber>=0.11,<1",
  "cryptography>=44,<49"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[project.scripts]
family-budget = "family_budget.cli:main"
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools.package-data]
"family_budget.migrations" = ["script.py.mako"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["E402"]
